name: CI

on:
  push:
    # master is the only long-lived branch.
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

# Least-privilege default: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Verify generated DB types are current
        run: |
          pnpm --filter @reflect/db db:codegen
          git diff --exit-code packages/db/src/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm --filter @reflect/db db:codegen' and commit the result." && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test-chromium:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install chromium

      - name: Test
        run: |
          ( while true; do echo "MEM $(date +%T) used=$(free -m | awk '/Mem:/{print $3}') $(ps -eo rss,args | grep -E 'headless-shell|chrome-linux' | grep -v grep | sed -E 's/^ *([0-9]+) .*--type=([a-z-]+).*--utility-sub-type=([a-zA-Z.]+).*/\1 \2:\3/; s/^ *([0-9]+) .*--type=([a-z-]+).*/\1 \2/; s/^ *([0-9]+) .*/\1 browser/' | awk '{if($1>m)m=$1} END{printf "max_chrome_proc=%dMB", m/1024}')"; sleep 10; done ) &
          pnpm run test || code=$?
          echo "=== dmesg oom ==="
          sudo dmesg | grep -i -E "oom|killed process|out of memory" | tail -20 || true
          exit ${code:-0}
        env:
          REFLECT_TEST_BROWSER: chromium
          DEBUG: "vitest:browser:gc"
          VITEST_CHROMIUM_GC_FORCE: "1"

  # Not part of `all-green`: a WebKit failure does not block merging.
  # Disabled on the `service` branch while the service refactor is in progress;
  # restore `github.event_name != 'merge_group'` before the branch is reviewed.
  test-webkit:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Install Playwright
        run: pnpm --filter @reflect/desktop exec playwright install webkit

      - name: Test
        run: pnpm run test
        env:
          REFLECT_TEST_BROWSER: webkit

  rust-lint:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The sidecar script imports npm packages.
      - uses: ./.github/actions/setup-node

      # tauri-build requires the sidecars before the desktop crate compiles.
      - name: Stage desktop sidecars
        run: node apps/desktop/scripts/build-sidecar.ts

      - name: Test
        run: cargo test --workspace

  # A single job for branch protection to require, instead of listing every
  # job as a required status check.
  all-green:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    if: always()
    needs: [node-lint, test-chromium, rust-lint, rust-test]

    steps:
      - name: Verify that all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (contains(needs.*.result, 'skipped') && github.event_name != 'merge_group') }}
        run: |
          echo 'Some jobs did not succeed: ${{ toJSON(needs) }}'
          exit 1
