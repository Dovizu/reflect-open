name: Release

# Stable and beta Release PRs share master but use separate lifecycle labels
# and head branches. A merged PR in one channel therefore cannot block the
# other channel from refreshing its open PR. Beta versions use a prerelease
# suffix (for example, X.Y.Z-beta or X.Y.Z-beta.N); publish-finalize.yml derives the
# prerelease/latest flags from that suffix.
#
# Everything runs on GITHUB_TOKEN. Tags created with that token do not trigger
# tag-push workflows, so publishing is called directly through job outputs.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the Release PRs
    if: github.repository == 'team-reflect/reflect-open'
    runs-on: ubuntu-latest
    # The stable and beta passes are folded into one set of desktop outputs
    # by the last step below, so the downstream jobs handle both channels the
    # same way.
    outputs:
      desktop_created: ${{ steps.desktop.outputs.created }}
      desktop_tag: ${{ steps.desktop.outputs.tag }}
      desktop_commit: ${{ steps.desktop.outputs.commit }}
      extension_created: ${{ steps.extension.outputs['apps/extension--release_created'] }}
      extension_tag: ${{ steps.extension.outputs['apps/extension--tag_name'] }}
      extension_commit: ${{ steps.extension.outputs['apps/extension--sha'] }}
    steps:
      # Stable runs first because a stable promotion advances
      # manifest.beta.json. Creating the stable tag before the beta pass gives
      # beta a valid anchor for the next prerelease cycle. Separate lifecycle
      # labels also let this pass refresh the stable PR immediately after a
      # beta PR is merged, before beta creates its tag below.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: stable
        with:
          target-branch: master
          config-file: .github/release-please/config.stable.json
          manifest-file: .github/release-please/manifest.stable.json

      # After a stable promotion, beta reads the new stable tag and manifest
      # before the superseded beta PR is closed below. After a beta release,
      # this pass creates the beta tag and clears beta's pending label.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: beta
        with:
          target-branch: master
          config-file: .github/release-please/config.beta.json
          manifest-file: .github/release-please/manifest.beta.json

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: extension
        with:
          target-branch: master
          config-file: .github/release-please/config.extension.json
          manifest-file: .github/release-please/manifest.extension.json

      # The desktop package lives at the repo root ("."), so the stable and
      # beta outputs have no path prefix. The channels never release from the
      # same push: a push merges at most one Release PR, and the two passes
      # only create releases for merged PRs on their own head branch (the
      # component in the branch name tells them apart). Fold them into a
      # single channel-agnostic set of outputs; publish-finalize.yml derives
      # the channel from the tag's prerelease suffix.
      - name: Unify the desktop release outputs
        id: desktop
        env:
          STABLE_CREATED: ${{ steps.stable.outputs.releases_created }}
          STABLE_TAG: ${{ steps.stable.outputs.tag_name }}
          STABLE_COMMIT: ${{ steps.stable.outputs.sha }}
          BETA_CREATED: ${{ steps.beta.outputs.releases_created }}
          BETA_TAG: ${{ steps.beta.outputs.tag_name }}
          BETA_COMMIT: ${{ steps.beta.outputs.sha }}
        run: |
          if [[ "$STABLE_CREATED" == true && "$BETA_CREATED" == true ]]; then
            echo "::error::Both the stable and beta passes created a release in the same push ($STABLE_TAG, $BETA_TAG)."
            exit 1
          elif [[ "$STABLE_CREATED" == true ]]; then
            tag="$STABLE_TAG"
            commit="$STABLE_COMMIT"
          elif [[ "$BETA_CREATED" == true ]]; then
            tag="$BETA_TAG"
            commit="$BETA_COMMIT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "created=true"
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  publish-browser-extension:
    name: Submit the Chrome extension
    needs: release-please
    if: needs.release-please.outputs.extension_created == 'true'
    uses: ./.github/workflows/publish-browser-extension.yml
    with:
      tag: ${{ needs.release-please.outputs.extension_tag }}
      commit: ${{ needs.release-please.outputs.extension_commit }}
    secrets:
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}

  # Merging a Release PR makes its channel's pass above create a draft release
  # and output its tag. Chain straight into the builds with the tag resolved to
  # its immutable commit once; the called workflows check out that SHA rather
  # than resolving the tag name again. The builds upload into the draft, and
  # the finalize job at the end publishes it.
  publish-macos:
    name: Build the macOS release
    needs: release-please
    if: needs.release-please.outputs.desktop_created == 'true'
    uses: ./.github/workflows/publish-macos.yml
    with:
      tag: ${{ needs.release-please.outputs.desktop_tag }}
      commit: ${{ needs.release-please.outputs.desktop_commit }}
    secrets: inherit

  # Every release also ships to TestFlight. iOS needs no version bump of its
  # own: the marketing version follows apps/desktop/package.json with the
  # prerelease suffix stripped, so beta and stable builds stack under the same
  # version, told apart by the UTC-timestamp build number.
  publish-testflight:
    name: Upload the release to TestFlight
    needs: release-please
    if: needs.release-please.outputs.desktop_created == 'true'
    uses: ./.github/workflows/publish-testflight.yml
    with:
      commit: ${{ needs.release-please.outputs.desktop_commit }}
    secrets: inherit

  # The experimental Windows build rides every release too: x64 and arm64
  # installers plus their updater signatures go into the draft release. The
  # installers are not code-signed; the secrets are only for the updater
  # signature.
  publish-windows:
    name: Build the Windows installer
    needs: release-please
    if: needs.release-please.outputs.desktop_created == 'true'
    uses: ./.github/workflows/publish-windows.yml
    with:
      tag: ${{ needs.release-please.outputs.desktop_tag }}
      commit: ${{ needs.release-please.outputs.desktop_commit }}
    secrets: inherit

  # The experimental Linux build rides every release too: x64 and arm64
  # AppImages and `.deb` packages plus their updater signatures go into the
  # draft release. The packages are not code-signed; the secrets are only for
  # the updater signature.
  publish-linux:
    name: Build the Linux packages
    needs: release-please
    if: needs.release-please.outputs.desktop_created == 'true'
    uses: ./.github/workflows/publish-linux.yml
    with:
      tag: ${{ needs.release-please.outputs.desktop_tag }}
      commit: ${{ needs.release-please.outputs.desktop_commit }}
    secrets: inherit

  # The builds only fill the draft release. Publishing waits for both macOS
  # and Windows to succeed. It also waits for Linux to finish, but a Linux
  # failure does not block it: the release then ships without the missing
  # Linux packages.
  publish-finalize:
    name: Finalize the release
    needs: [release-please, publish-macos, publish-windows, publish-linux]
    if: ${{ !cancelled() && needs.publish-macos.result == 'success' && needs.publish-windows.result == 'success' }}
    uses: ./.github/workflows/publish-finalize.yml
    with:
      tag: ${{ needs.release-please.outputs.desktop_tag }}
